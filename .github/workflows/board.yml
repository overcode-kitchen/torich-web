name: Board

# PR이 integration에 머지되면, 그 PR이 닫기로 한 이슈들을 보드의 "배포대기"로 옮긴다.
#
# 왜 Action이 필요한가:
#   Projects 내장 워크플로의 "Pull request merged"는 보드에 올라온 **PR 카드**의 상태만 바꾼다.
#   우리 보드는 이슈만 올리므로(PR까지 올리면 2인 팀에 카드가 두 배가 된다) 발동할 대상이 없다.
#   "연결된 이슈를 옮기는" 내장 워크플로는 존재하지 않아서 직접 처리한다.
#
# main 머지는 여기서 다루지 않는다. 그때는 `Closes #N`이 이슈를 닫고,
# Projects 내장 워크플로 "Item closed"가 완료로 옮긴다.
on:
  pull_request:
    types: [closed]
    branches: [integration]

jobs:
  move:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # GITHUB_TOKEN은 조직 Projects에 쓸 수 없어 별도 PAT가 필요하다.
      # 설정 방법은 docs/github-projects-setup.md 참고.
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: overcode-kitchen
      PROJECT_NUMBER: '2'
      TARGET_STATUS: 배포대기
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # 스크립트에 직접 보간하면 PR 제목/본문이 셸 명령으로 실행될 수 있다. 반드시 env로 받는다.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: 연결된 이슈를 배포대기로 이동
        run: |
          set -euo pipefail

          # 보드 한 칸 때문에 CI가 빨개지면 안 된다. 토큰이 없으면 경고만 남기고 넘어간다.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PROJECT_TOKEN 시크릿이 없어 보드 이동을 건너뛴다."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          # 1. 이 PR이 닫기로 한 이슈 번호를 직접 파싱한다.
          #
          #    GraphQL의 closingIssuesReferences는 쓸 수 없다. 깃헙은 PR의 base가
          #    기본 브랜치(main)일 때만 닫기 링크를 만들기 때문에, integration 대상
          #    PR에서 "Closes #N"은 단순 언급(CrossReferencedEvent)으로만 남는다.
          #    제목·본문·커밋 메시지를 모두 훑어 어디에 썼든 잡히게 한다.
          text=$(
            printf '%s\n%s\n' "$PR_TITLE" "${PR_BODY:-}"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --paginate --jq '.[].commit.message'
          )
          numbers=$(printf '%s' "$text" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$numbers" ]; then
            echo "닫기 키워드가 없다. 커밋 메시지나 PR 본문에 'Closes #N' 을 쓰면 자동으로 옮겨진다."
            exit 0
          fi
          echo "대상 이슈: $(echo "$numbers" | tr '\n' ' ')"

          # 2. Status 필드와 대상 옵션 ID를 이름으로 찾는다.
          #    ID를 하드코딩하면 보드를 손볼 때마다 조용히 깨진다.
          meta=$(gh api graphql -f query='
            query($owner:String!,$number:Int!){
              organization(login:$owner){
                projectV2(number:$number){
                  id
                  field(name:"Status"){
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
            }' -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")

          project_id=$(echo "$meta" | jq -r '.data.organization.projectV2.id // empty')
          field_id=$(echo "$meta" | jq -r '.data.organization.projectV2.field.id // empty')
          option_id=$(echo "$meta" | jq -r --arg n "$TARGET_STATUS" \
            '.data.organization.projectV2.field.options[]? | select(.name==$n) | .id')

          if [ -z "$project_id" ] || [ -z "$option_id" ]; then
            echo "::warning::보드에서 '$TARGET_STATUS' 상태를 찾지 못했다. 컬럼 이름을 바꿨다면 이 워크플로의 TARGET_STATUS도 함께 바꿀 것."
            exit 0
          fi

          # 3. 각 이슈의 보드 카드를 찾아 상태를 바꾼다.
          for number in $numbers; do
            item_id=$(gh api graphql -f query='
              query($owner:String!,$repo:String!,$n:Int!){
                repository(owner:$owner,name:$repo){
                  issue(number:$n){ projectItems(first:20){ nodes{ id project{ id } } } }
                }
              }' -f owner="$owner" -f repo="$repo" -F n="$number" \
              --jq ".data.repository.issue.projectItems.nodes[]? | select(.project.id==\"$project_id\") | .id" || true)

            if [ -z "$item_id" ]; then
              echo "#$number 는 보드에 없어 건너뛴다."
              continue
            fi

            gh api graphql --silent -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
                updateProjectV2ItemFieldValue(
                  input:{projectId:$p, itemId:$i, fieldId:$f, value:{singleSelectOptionId:$o}}
                ){ projectV2Item{ id } }
              }' -f p="$project_id" -f i="$item_id" -f f="$field_id" -f o="$option_id"

            echo "#$number → $TARGET_STATUS"
          done
