name: 기능 / 개선
description: 새 기능이나 기존 기능 개선
title: "feat(scope): "
labels: ["feat"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무엇을 / 왜
      description: 사용자가 무엇을 할 수 있게 되는지, 왜 필요한지
      placeholder: |
        예) 목적 카드에서 바로 납입을 미룰 수 있게 한다.
        지금은 상세 진입 → 메뉴 → 미루기까지 3탭이 필요하다.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 이게 되면 닫는다, 를 체크리스트로
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 영향 범위
      description: 하나라도 체크되면 `app-update-required` 라벨을 붙인다. 그 릴리스는 앱 심사가 필요하다.
      options:
        - label: iOS 네이티브 코드 · Capacitor 플러그인 · 권한 변경
        - label: 라우팅 경로 신규 추가/변경 (정적 export 산출물에 영향)
        - label: Supabase 스키마 변경 (마이그레이션 필요)
        - label: Edge Function 변경 (별도 배포 필요)
